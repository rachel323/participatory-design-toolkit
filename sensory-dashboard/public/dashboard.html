<!DOCTYPE html>
<html>
<head>
    <title>Wizard Control Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="top-bar">
        <a href="/" class="home-button">Back to home</a>
        <form action="/stop-session" method="POST" class="top-right-form">
            <button type="submit" class="stop-button">Stop session</button>
        </form>
    </div>

    <h1>Wizard Control Dashboard</h1>

    <div id="dashboardSections">
        <!-- WLED Controls -->
        <div class="section" id="ledStripSection" style="background-color: beige;">
            <h2>LED Strip</h2>
            <button onclick="sendWLEDCommand('on', 'LED AAN')">On</button>
            <button onclick="sendWLEDCommand('off', 'LED UIT')">Off</button>
            <input type="color" id="ledColor" value="#ff0000">
            <button onclick="setLEDColor()">Set colour</button>
            <input type="range" id="brightness" min="0" max="255" value="128">
            <button onclick="setLEDBrightness()">Brightness</button>

            <div class="subsection">
                <h3>Effects</h3>
                <!--There are more effects via: https://kno.wled.ge/interfaces/json-api/ 
                to add more effects find which number it is from their effects list and add the setLEDEffect-->
                <button onclick="setLEDEffect(0)">Solid</button>
                <button onclick="setLEDEffect(2)">Breathe</button>
                <button onclick="setLEDEffect(3)">Wipe</button>
                <button onclick="setLEDEffect(20)">Sparkle</button>
                <button onclick="setLEDEffect(25)">Strobe</button>
                <button onclick="setLEDEffect(74)">Colortwinkle</button>
                <button onclick="setLEDEffect(9)">Rainbow</button>
            </div>
        </div>

        <div class="side-by-side-panels">
            <!-- Sound Controls -->
            <div class="section" id="soundSection" style="background-color: rgb(255, 220, 240);">
                <h2>Sound</h2>
                <!-- make sure the correct soundfiles are in the 'sounds' folder in the project 
                also check this at the KEYMAP section below for sounds triggered by keys-->
                
                <div class="subsection">
                    <h3>Music adjustments</h3>
                    <p> Low-pass: <span id="lowpassValue">20000</span> Hz
                    &emsp; High-pass: <span id="highpassValue">20</span> Hz
                    &emsp; Playback Rate: <span id="playbackValue">1.00</span> 
                    &emsp; Volume: don't know yet
                    </p>
                </div>

                <div class="subsection">
                    <h3>Music</h3>
                    <div class="music-grid">
                        <button data-file="/sounds/bg_1.wav" onclick="playMusic('/sounds/bg_1.wav', this)">One</button>
                        <button data-file="/sounds/bg_2.wav" onclick="playMusic('/sounds/bg_2.wav', this)">Two</button>
                        <button data-file="/sounds/bg_3.wav" onclick="playMusic('/sounds/bg_3.wav', this)">Three</button>
                        <button data-file="/sounds/bg_4.wav" onclick="playMusic('/sounds/bg_4.wav', this)">Four</button>
                        <button data-file="/sounds/bg_5.wav" onclick="playMusic('/sounds/bg_5.wav', this)">Five</button>
                        <button data-file="/sounds/bg_6.wav" onclick="playMusic('/sounds/bg_6.wav', this)">Six</button>
                    </div>
                </div>


                <div class="subsection">
                    <h3>Sound effects</h3>
                    <div class="music-grid">
                        <button onclick="playSfx('/sounds/sfx_1.1.wav', this)">Pling</button>
                        <button onclick="playSfx('/sounds/sfx_1.2.wav', this)">Plop</button>
                        <button onclick="playSfx('/sounds/sfx_1.3.wav', this)">Honk</button>
                        <button onclick="playSfx('/sounds/sfx_2.1.wav', this)">Whoosh</button>
                        <button onclick="playSfx('/sounds/sfx_2.2.wav', this)">Spring</button>
                        <button onclick="playSfx('/sounds/sfx_2.3.wav', this)">Drum</button>
                    </div>
                </div>
            </div>

            <!-- Haptics Controls -->
            <div class="section" id="hapticsSection" style="background-color: rgb(243, 254, 238);">
                    <h2>Haptics</h2>
                    <h3>Single vibration</h3>
                    <div class="haptics-grid">
                        <div class="haptics-motor-card">
                            <button type="button" onclick="vibrateMotor(1)" style="background-color: rgb(0, 191, 255);">Motor 1</button>
                            <div class="pattern-controls">
                                <label>
                                    Duration
                                    <input type="range" id="patternDuration-1" data-motor-id="1" min="250" max="2000" step="250" value="250">
                                    <span id="patternDurationValue-1">250</span> ms
                                </label>
                                <label>
                                    Interval
                                    <input type="range" id="patternInterval-1" data-motor-id="1" min="250" max="2000" step="250" value="250">
                                    <span id="patternIntervalValue-1">250</span> ms
                                </label>
                                <button type="button" class="pattern-toggle" data-motor-id="1" onclick="toggleVibrationPattern(1)">Pattern: OFF</button>
                            </div>
                        </div>

                        <div class="haptics-motor-card">
                            <button type="button" onclick="vibrateMotor(2)" style="background-color: rgb(245, 75, 168);">Motor 2</button>
                            <div class="pattern-controls">
                                <label>
                                    Duration
                                    <input type="range" id="patternDuration-2" data-motor-id="2" min="250" max="2000" step="250" value="250">
                                    <span id="patternDurationValue-2">250</span> ms
                                </label>
                                <label>
                                    Interval
                                    <input type="range" id="patternInterval-2" data-motor-id="2" min="250" max="2000" step="250" value="250">
                                    <span id="patternIntervalValue-2">250</span> ms
                                </label>
                                <button type="button" class="pattern-toggle" data-motor-id="2" onclick="toggleVibrationPattern(2)">Pattern: OFF</button>
                            </div>
                        </div>

                        <div class="haptics-motor-card">
                            <button type="button" onclick="vibrateMotor(3)" style="background-color: rgb(9, 207, 9); color: white;">Motor 3</button>
                            <div class="pattern-controls">
                                <label>
                                    Duration
                                    <input type="range" id="patternDuration-3" data-motor-id="3" min="250" max="2000" step="250" value="250">
                                    <span id="patternDurationValue-3">250</span> ms
                                </label>
                                <label>
                                    Interval
                                    <input type="range" id="patternInterval-3" data-motor-id="3" min="250" max="2000" step="250" value="250">
                                    <span id="patternIntervalValue-3">250</span> ms
                                </label>
                                <button type="button" class="pattern-toggle" data-motor-id="3" onclick="toggleVibrationPattern(3)">Pattern: OFF</button>
                            </div>
                        </div>

                        <div class="haptics-motor-card">
                            <button type="button" onclick="vibrateMotor(4)" style="background-color: rgb(254, 147, 15);">Motor 4</button>
                            <div class="pattern-controls">
                                <label>
                                    Duration
                                    <input type="range" id="patternDuration-4" data-motor-id="4" min="250" max="2000" step="250" value="250">
                                    <span id="patternDurationValue-4">250</span> ms
                                </label>
                                <label>
                                    Interval
                                    <input type="range" id="patternInterval-4" data-motor-id="4" min="250" max="2000" step="250" value="250">
                                    <span id="patternIntervalValue-4">250</span> ms
                                </label>
                                <button type="button" class="pattern-toggle" data-motor-id="4" onclick="toggleVibrationPattern(4)">Pattern: OFF</button>
                            </div>
                        </div>
                    </div>
            </div>
        </div>
    </div>

    <script>
        const WLED_IP = 'http://4.3.2.1/';  //ensure WLED is connected to same network
        const activeAudios = {};

        async function loadDashboardConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                const sections = config.sections || {};

                if (!sections.sound) {
                    document.getElementById('soundSection').style.display = 'none';
                }

                if (!sections.ledStrip) {
                    document.getElementById('ledStripSection').style.display = 'none';
                }

                if (!sections.haptics) {
                    document.getElementById('hapticsSection').style.display = 'none';
                }
            } catch (error) {
                console.warn('Could not load dashboard config:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboardConfig);


        //------------------------LEDs-----------------------------------

        // Send commands to WLED via the backend (proxy)
        function sendWLEDCommand(command, description) {
            fetch('/api/wled', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command, description })
            }).catch(error => console.error('Error:', error));
        }

        function setLEDColor() {
            const color = document.getElementById('ledColor').value;
            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            sendWLEDCommand(`R=${r}&G=${g}&B=${b}`, 'Kleur gewijzigd');
        }

        function setLEDBrightness() {
            const brightness = document.getElementById('brightness').value;
            sendWLEDCommand(`A=${brightness}`, 'Helderheid gewijzigd');
        }

        function setLEDEffect(effectId) {
            sendWLEDCommand(`FX=${effectId}`, `Effect ${effectId} ingesteld`);
        }

        // ======================= MUSIC =======================

        const activeMusic = new Map();

        const audioContext = new AudioContext();

        const lowpass = audioContext.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = 20000;

        const highpass = audioContext.createBiquadFilter();
        highpass.type = "highpass";
        highpass.frequency.value = 20;

        let playbackRate = 1.0;

        let lowpassFreq = 20000;
        let highpassFreq = 20;

        function findMusicButton(filePath) {
            const buttons = document.querySelectorAll('[data-file]');

            for (const button of buttons) {
                if (button.dataset.file === filePath) {
                    return button;
                }
            }

            return null;
        }

        function setMusicButtonState(filePath, isActive, explicitButton = null) {
            const button = explicitButton || findMusicButton(filePath);

            if (!button) {
                return;
            }

            button.classList.toggle('active', isActive);
        }

        function stopMusicFile(filePath) {
            const activeTrack = activeMusic.get(filePath);

            if (!activeTrack) {
                return;
            }

            activeTrack.audio.pause();
            activeTrack.audio.currentTime = 0;

            if (activeTrack.source) {
                activeTrack.source.disconnect();
            }

            setMusicButtonState(filePath, false, activeTrack.buttonElement);
            activeMusic.delete(filePath);
        }

        function playMusic(filePath, buttonElement = null) {
            if (activeMusic.has(filePath)) {
                stopMusicFile(filePath);
                return;
            }

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }

            const audio = new Audio(filePath);
            audio.loop = true;
            audio.playbackRate = playbackRate;

            const source = audioContext.createMediaElementSource(audio);

            source.connect(highpass);
            highpass.connect(lowpass);
            lowpass.connect(audioContext.destination);

            audio.play().catch(err => console.error(err));

            const resolvedButton = buttonElement || findMusicButton(filePath);

            activeMusic.set(filePath, {
                audio,
                source,
                buttonElement: resolvedButton
            });

            if (resolvedButton) {
                resolvedButton.classList.add("active");
            }

            logAction("PLAY_MUSIC", {
                soundFile: filePath
            });
        }

        //update de knopbewegingen in het dashboard
        function updateAudioDashboard() {
            document.getElementById("playbackValue").textContent =
                playbackRate.toFixed(2);

            document.getElementById("lowpassValue").textContent =
                lowpassFreq;

            document.getElementById("highpassValue").textContent =
                highpassFreq;
        }

        // ======================= SOUND EFFECTS =======================

        function playSfx(filePath) {

            const audio = new Audio(filePath);

            audio.play().catch(err => console.error(err));

            logAction("PLAY_SOUND", {
                soundFile: filePath
            });
        }

        // ======================= KEY MAP =======================

        // this maps the sounds to keys on the laptops keyboard. 
        // The audio controller is then mapped to the laptop keyboard
        

        // music is mapped to the second row of keys
        const musicKeyMap = {
            'a': '/sounds/bg_1.wav',
            's': '/sounds/bg_2.wav',
            'd': '/sounds/bg_3.wav',
            'f': '/sounds/bg_4.wav',
            'g': '/sounds/bg_5.wav',
            'h': '/sounds/bg_6.wav'
        };

            //sound effects are mapped to the numpad numbers
        const sfxKeyMap = {
            '1': '/sounds/sfx_1.1.wav',
            '2': '/sounds/sfx_1.2.wav',      
            '3': '/sounds/sfx_1.3.wav',
            '4': '/sounds/sfx_2.1.wav',
            '5': '/sounds/sfx_2.2.wav',
            '6': '/sounds/sfx_2.3.wav'
        };

        // ======================= KEYBOARD =======================

        //handles music or sound effects triggered by key presses, rather than mouse clicks



        document.addEventListener('keydown', (event) => {

            if (event.repeat) return;

            const key = event.key.toLowerCase();

            // ---------- Muziek ----------
            if (musicKeyMap[key]) {
                event.preventDefault();
                const filePath = musicKeyMap[key];
                const matchingButton = findMusicButton(filePath);
                playMusic(filePath, matchingButton);
                return;
            }

            // ---------- Sound effects ----------
            if (sfxKeyMap[key]) {
                event.preventDefault();
                playSfx(sfxKeyMap[key]);
                return;
            }

            // ---------- Effect sliders ----------
            if (activeMusic.size > 0) {

                switch (event.key) {

                    // Playback rate adjusted through arrows up and down
                    case "ArrowUp":
                        event.preventDefault();
                        playbackRate = Math.min(2.0, playbackRate + 0.05);
                        activeMusic.forEach(({ audio }) => {
                            audio.playbackRate = playbackRate;
                        });
                        updateAudioDashboard();
                        console.log("Playback:", playbackRate.toFixed(2));
                        break;


                    case "ArrowDown":
                        event.preventDefault();
                        playbackRate = Math.max(0.5, playbackRate - 0.05);
                        activeMusic.forEach(({ audio }) => {
                            audio.playbackRate = playbackRate;
                        });
                        updateAudioDashboard();
                        console.log("Playback:", playbackRate.toFixed(2));
                        break;

                    // Low-pass filter adjusted through arrows <- ->
                    case "ArrowLeft":
                        event.preventDefault();
                        lowpassFreq = Math.max(500, lowpassFreq - 500);
                        lowpass.frequency.value = lowpassFreq;
                        updateAudioDashboard();
                        console.log("Low-pass:", lowpassFreq);
                        break;

                    case "ArrowRight":
                        event.preventDefault();
                        lowpassFreq = Math.min(20000, lowpassFreq + 500);
                        lowpass.frequency.value = lowpassFreq;
                        updateAudioDashboard();
                        console.log("Low-pass:", lowpassFreq);
                        break;

                    // High-pass filter adjusted through Q and E keys
                    case "q":
                        event.preventDefault();
                        highpassFreq = Math.min(5000, highpassFreq + 50);
                        highpass.frequency.value = highpassFreq;
                        updateAudioDashboard();
                        console.log("High-pass:", highpassFreq);
                        break;

                    // High-pass omlaag
                    case "e":
                        event.preventDefault();
                        highpassFreq = Math.max(20, highpassFreq - 50);
                        highpass.frequency.value = highpassFreq;
                        updateAudioDashboard();
                        console.log("High-pass:", highpassFreq);
                        break;
                }
            }

        });
        
        //-------------------------------HAPTICS---------------------------

        function vibrateMotor(motorId, duration = 300) {
            fetch(`/api/motor/${motorId}/vibrate`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    duration: duration
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log(`Motor ${motorId} geactiveerd`, data);
            })
            .catch(error => {
                console.error(error);
            });
        }

        const patternState = {};

        function updatePatternDisplay(motorId) {
            const duration = document.getElementById(`patternDuration-${motorId}`).value;
            const interval = document.getElementById(`patternInterval-${motorId}`).value;

            document.getElementById(`patternDurationValue-${motorId}`).textContent = duration;
            document.getElementById(`patternIntervalValue-${motorId}`).textContent = interval;

            const toggle = document.querySelector(`.pattern-toggle[data-motor-id="${motorId}"]`);
            if (toggle && !patternState[motorId]) {
                toggle.textContent = 'Pattern: OFF';
            }
        }

        function toggleVibrationPattern(motorId) {
            const duration = Number(document.getElementById(`patternDuration-${motorId}`).value);
            const interval = Number(document.getElementById(`patternInterval-${motorId}`).value);
            const toggle = document.querySelector(`.pattern-toggle[data-motor-id="${motorId}"]`);
            const nextState = !Boolean(patternState[motorId]);

            patternState[motorId] = nextState;

            fetch(`/api/motor/${motorId}/pattern`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    on: nextState,
                    duration,
                    interval
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log(`Pattern update for motor ${motorId}:`, data);
                toggle.textContent = nextState ? 'Pattern: ON' : 'Pattern: OFF';
            })
            .catch(error => {
                console.error(`Pattern update failed for motor ${motorId}:`, error);
            });
        }

        [1, 2, 3, 4].forEach((motorId) => {
            document.getElementById(`patternDuration-${motorId}`).addEventListener('input', () => updatePatternDisplay(motorId));
            document.getElementById(`patternInterval-${motorId}`).addEventListener('input', () => updatePatternDisplay(motorId));
            updatePatternDisplay(motorId);
        });
        
        //----------------------------LOGGING---------------------------------

       
        function logAction(action, details = {}) {
            fetch('/api/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, details })
            }).catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
